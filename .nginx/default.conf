upstream backend_svc {
    zone backend_svc 64k;
    server backend:8500;
}

limit_req_zone $binary_remote_addr zone=ip_api_limit:10m rate=5r/s;

server {
    listen 80;
    server_tokens off;
    port_in_redirect off;

    location /api/users {
        limit_req zone=ip_api_limit burst=3 nodelay;
        limit_req_status 429;
        
        include /etc/nginx/conf.d/snippets/proxy-defaults.conf;
    }

    # Rute umum tanpa rate limit
    location / {
        include /etc/nginx/conf.d/snippets/proxy-defaults.conf;
    }
}