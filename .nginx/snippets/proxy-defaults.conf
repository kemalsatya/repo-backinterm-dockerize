proxy_pass http://backend_svc;
proxy_set_header Host $http_host;                   # sekaligus membawa port 8080
proxy_set_header X-Forwarded-For $remote_addr;      # tanpa cdn/load balancer di depan nginx

add_header X-Upstream $upstream_addr always;        # melihat replica yang mengerjakan request untuk semua status code
add_header X-Content-Type-Options "nosniff" always; # pencegahan header tanpa Content-Type
add_header X-Frame-Options "DENY" always;

gzip on;
gzip_types application/json;