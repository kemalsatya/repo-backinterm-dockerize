services:
  backend:
    build: .
    deploy:
      replicas: 3
    # ports:
    #   - "8500:8500"
    environment:
      # PORT: 8500
      NODE_ENV: production
      MONGO_DB: ${MONGO_DB}
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  
  mongo:
    image: mongo:7
    volumes:
    - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./.nginx:/etc/nginx/conf.d:ro 

volumes:
  mongo_data: